deuda_de_reproducibilidad:
  # Hallazgo real de Luna (2026-09-17, segunda auditoria post-normalizacion):
  # el record schema tuvo 3 versiones distintas en vivo durante la corrida.
  # enrichment.jsonl y warehouse_v3_2.sqlite preservan el HASH de la version
  # con la que cada registro fue generado originalmente
  # (record_schema_sha256_at_generation), pero el CONTENIDO de esas 2
  # versiones antiguas del schema no quedo archivado en ningun lado --
  # Trabajo/config/enrichment_record_schema_v3_2.json solo tiene la version
  # vigente. El proyecto no es un repositorio git (sin historial de commits),
  # asi que esas 2 versiones no se pueden reconstruir con certeza. No es
  # corrupcion de datos (los 934 registros validan contra el schema vigente),
  # pero es una limitacion real de auditabilidad retroactiva a nivel de
  # schema completo, solo mitigada a nivel de hash.
  estado: aceptado_como_limitacion_conocida
  mitigacion_futura: "archivar copia del record schema en _SUPERADO/ cada vez que cambie durante una corrida en curso, no solo al final"
