[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[project]
name = "consultora-caso-inmobiliario-stgo"
version = "0.1.0"
description = "Pipeline de conflictividad inmobiliaria/urbana en Santiago (32 comunas, 2014-2026)"
requires-python = ">=3.11"
dependencies = [
  "requests",
  "beautifulsoup4",
  "trafilatura",
  "PyMuPDF",
  "jsonschema",
  "networkx",
  "openpyxl",
  "PyYAML",
  "scipy",
  "shapely",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
